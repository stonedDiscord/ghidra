name: Java CI with Gradle

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 8.14.3

    - name: Fetch dependencies
      run: gradle -I gradle/support/fetchDependencies.gradle

    - name: Prepare Maven
      run: gradle prepdev

    - name: Build natives
      run: gradle buildNatives

    - name: Compile sleigh files
      run: gradle sleighCompile

    - name: Build Javadoc
      run: gradle createJavadocs

    - name: Build Python3 package
      run: gradle buildPyPackage

    - name: Build with Gradle Wrapper
      run: gradle buildGhidra --parallel

    - name: Prepare PyGhidra
      run: gradle prepPyGhidra

    - uses: actions/upload-artifact@v4
      with:
        path: build/dist/*.zip

  unittests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 8.14.3

    - name: Fetch dependencies
      run: gradle -I gradle/support/fetchDependencies.gradle

    - name: Prepare Maven
      run: gradle prepdev

    - name: Unit test report
      run: gradle unitTestReport

  integrationtests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 8.14.3

    - name: Fetch dependencies
      run: gradle -I gradle/support/fetchDependencies.gradle

    - name: Prepare Maven
      run: gradle prepdev

    - name: Integration tests
      run: |
        Xvfb :99 -nolisten tcp &
        export DISPLAY=:99
        gradle integrationTest

